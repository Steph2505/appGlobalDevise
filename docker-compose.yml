services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nols25
      MYSQL_DATABASE: devis_db
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pnols25"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./deviseApp-back
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8000"
    volumes:
      - ./deviseApp-back:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: devis_db
      DB_USERNAME: root
      DB_PASSWORD: nols25
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./deviseApp-front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./deviseApp-front:/app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: http://localhost:8081/api
    depends_on:
      - backend

volumes:
  db_data:
